name: Devocional Short
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render MP4 con movimiento y fundidos
        run: |
          mkdir -p videos
          ffmpeg -y -loop 1 -framerate 30 -i imagenes/oracion-2026-10-20.png -vf "scale=1080:1080,zoompan=z='min(zoom+0.0003,1.11)':d=360:s=1080x1920:fps=30,format=yuv420p,fade=t=in:st=0:d=1,fade=t=out:st=11:d=1" -t 12 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -movflags +faststart videos/oracion-papa-leon-xiv-2026-10-20.mp4
      - name: Confirmar MP4 en repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f videos/oracion-papa-leon-xiv-2026-10-20.mp4
          git commit -m "Render devocional para YouTube Shorts" || exit 0
          git push
