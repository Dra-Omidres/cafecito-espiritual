name: Convertir imágenes devocionales a PNG
on:
  push:
    paths:
      - 'imagenes/*.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar conversor
        run: python -m pip install --quiet cairosvg
      - name: Convertir SVG en PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for path in Path('imagenes').glob('*.svg'):
              cairosvg.svg2png(url=str(path), write_to=str(path.with_suffix('.png')), output_width=2160, output_height=2160)
          PY
      - name: Confirmar imágenes PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagenes/*.png
          if ! git diff --cached --quiet; then git commit -m "Convertir imágenes SVG a PNG"; git push; fi
