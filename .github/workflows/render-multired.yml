name: Cafecito - Render multired vertical
on:
  push:
    paths:
      - 'solicitudes-video/*.json'
      - '.github/workflows/render-multired.yml'
      - 'scripts/render_multired.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: video-cafecito-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg y FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Comprobar recursos
        run: |
          python3 --version
          ffmpeg -version | head -1
          mkdir -p videos
      - name: Renderizar solicitudes pendientes
        run: |
          for request in solicitudes-video/*.json; do
            [ -f "$request" ] || continue
            python3 scripts/render_multired.py "$request"
          done
      - name: Guardar los MP4 y manifiestos verificados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f videos/*.mp4 videos/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Renderizar videos verticales multired"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "No se pudo sincronizar el archivo tras tres intentos" >&2
            exit 1
          fi
